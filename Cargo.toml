[package]
name = "ettin-edit"
version = "2.8.0"
edition = "2024"
description = "A modern, cross-platform text editor for Linux and Windows"
license = "MIT"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11", "persistence"] }
egui = "0.36"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy", "parsing", "plist-load", "yaml-load"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
dirs = "6"
ropey = "1"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
unicode-segmentation = "1"
unicode-width = "0.2"
encoding_rs = "0.8.42"
chardetng = "1.0.0"
trash = "5.2.9"
roxmltree = "0.21.1"
miniz_oxide = "0.9.1"
similar = { version = "2.7.0", features = ["unicode"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
csv = "1.4.0"
egui_extras = { version = "0.36", features = ["file", "http", "image", "svg", "svg_text", "gif", "webp"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
skrifa = "0.44"
plist = "1.10"
ureq = { version = "3", features = ["platform-verifier"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = "0.11"
pulldown-cmark = { version = "0.13.4", default-features = false }
fluent-bundle = "0.16.0"
unic-langid = "0.9.6"
sys-locale = "0.3.2"
egui-phosphor = "0.14.0"
unicode_names2 = "4"
tar = { version = "0.4.46", default-features = false }
flate2 = "1.1.10"
md-5 = "0.11"
sha1 = "0.11"
crc32fast = "1"
serde_yaml_ng = "0.10.0"
toml = { version = "1.1.8", features = ["preserve_order"] }
notify = "8"
# Tables (2.7): reading Excel/OpenDocument workbooks and writing .xlsx.
calamine = { version = "0.38", features = ["dates"] }
rust_xlsxwriter = "0.102"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"

# Raising the window when a file is handed over (src/raise.rs).
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
raw-window-handle = "0.6"
x11rb = "0.13"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true


[dev-dependencies]
fluent-syntax = "0.12"

[build-dependencies]
winresource = "0.1"

# The regex engines are very slow unoptimised; this keeps debug builds usable
# (syntax highlighting and the function list both lean on them).
[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.regex-syntax]
opt-level = 3
