name: CI

# Runs on code changes only: a change that touches nothing but documentation
# (Markdown files outside the user manual, screenshots, the mascot, LICENSE)
# skips CI. No branch protection requires these checks, so a skipped run
# doesn't hold up a merge.
on:
  push:
    branches: [main]
    paths:
      - "**"
      # Documentation alone doesn't need a build. The user manual is compiled
      # into the app, so changes to it still run CI (manual.yml builds the site).
      - "!**.md"
      - "!docs/**"
      - "!LICENSE"
      - "docs/manual/**"
  pull_request:
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "!LICENSE"
      - "docs/manual/**"

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-0 libgl1
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build release
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: ettin-edit-linux-x86_64
          path: target/release/ettin-edit

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test
      - name: Build release
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: ettin-edit-windows-x86_64
          path: target/release/ettin-edit.exe
