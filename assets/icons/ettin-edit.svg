<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Ettin Edit</title>
  <!-- Original app icon for Ettin Edit: Edda and Ottar, the two heads of the mascot -->
  <defs>
    <clipPath id="tile"><rect x="8" y="8" width="240" height="240" rx="52"/></clipPath>
    <radialGradient id="skin" cx="45%" cy="40%" r="65%">
      <stop offset="0" stop-color="#F7D3B0"/>
      <stop offset="1" stop-color="#E5AE84"/>
    </radialGradient>
    <radialGradient id="tunic" cx="50%" cy="35%" r="70%">
      <stop offset="0" stop-color="#9C6B45"/>
      <stop offset="1" stop-color="#6E4628"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9D1DA"/>
      <stop offset="1" stop-color="#8E99A6"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="#2D2D2D"/>
  <g clip-path="url(#tile)">
    <g transform="translate(-35 6) scale(0.64)">
  <!-- body -->
  <path d="M100 360 C 100 250, 170 214, 256 214 C 342 214, 412 250, 412 360 C 412 430, 350 460, 256 460 C 162 460, 100 430, 100 360 Z" fill="url(#tunic)"/>
  <!-- fur collar -->
  <path d="M136 262 q 20 -22 40 -6 q 20 -20 40 -4 q 20 -18 40 -2 q 20 -18 40 2 q 20 -16 40 4 q 20 -14 36 8 q -10 26 -116 26 q -110 0 -120 -28 Z" fill="#D8C8AE"/>
  <!-- belt -->
  <rect x="104" y="368" width="304" height="26" rx="6" fill="#4A2F1B"/>
  <rect x="236" y="362" width="40" height="38" rx="6" fill="#FFCC66" stroke="#C99A3A" stroke-width="4"/>
  <rect x="249" y="374" width="14" height="14" rx="2" fill="#4A2F1B"/>
  
  <!-- ===== left head: Edda ===== -->
  <g>
    <circle cx="180" cy="188" r="76" fill="url(#skin)"/>
    <!-- ears -->
    <ellipse cx="104" cy="196" rx="12" ry="18" fill="#E5AE84"/>
    <!-- helmet horns -->
    <path d="M118 150 C 86 140, 70 106, 78 72 C 92 98, 108 112, 136 120 Z" fill="#F3E9D2" stroke="#C9B48A" stroke-width="3"/>
    <path d="M242 150 C 274 140, 290 106, 282 72 C 268 98, 252 112, 224 120 Z" fill="#F3E9D2" stroke="#C9B48A" stroke-width="3"/>
    <!-- helmet -->
    <path d="M106 168 C 106 108, 140 100, 180 100 C 220 100, 254 108, 254 168 Z" fill="url(#steel)"/>
    <rect x="102" y="160" width="156" height="18" rx="9" fill="#7D8794"/>
    <circle cx="130" cy="169" r="4" fill="#C9D1DA"/>
    <circle cx="180" cy="169" r="4" fill="#C9D1DA"/>
    <circle cx="230" cy="169" r="4" fill="#C9D1DA"/>
    <path d="M180 100 v 60" stroke="#7D8794" stroke-width="10"/>
    <!-- eyebrows: very serious about indentation -->
    <path d="M140 188 l 26 6 M220 188 l -26 6" stroke="#8A5A3A" stroke-width="6" stroke-linecap="round"/>
    <!-- eyes -->
    <ellipse cx="156" cy="208" rx="11" ry="14" fill="#2D2D2D"/>
    <ellipse cx="204" cy="208" rx="11" ry="14" fill="#2D2D2D"/>
    <circle cx="160" cy="203" r="4" fill="#fff"/>
    <circle cx="208" cy="203" r="4" fill="#fff"/>
    <!-- cheeks -->
    <ellipse cx="134" cy="232" rx="12" ry="7" fill="#F28E8E" opacity="0.55"/>
    <ellipse cx="226" cy="232" rx="12" ry="7" fill="#F28E8E" opacity="0.55"/>
    <!-- braided pink beard -->
    <path d="M128 236 C 140 262, 160 270, 180 270 C 200 270, 220 262, 232 236 C 222 250, 200 252, 180 252 C 160 252, 138 250, 128 236 Z" fill="#CC99CC"/>
    <path d="M180 262 c -12 8 -12 18 0 24 c 12 6 12 16 0 24 c -12 8 -12 16 0 20" fill="none" stroke="#CC99CC" stroke-width="16" stroke-linecap="round"/>
    <circle cx="180" cy="336" r="7" fill="#FFCC66"/>
    <!-- determined little mouth -->
    <path d="M168 238 q 12 8 24 0" fill="none" stroke="#8A3B3B" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- ===== right head: Ottar ===== -->
  <g>
    <circle cx="332" cy="188" r="76" fill="url(#skin)"/>
    <ellipse cx="408" cy="196" rx="12" ry="18" fill="#E5AE84"/>
    <!-- wild blue hair -->
    <path d="M262 168 C 254 128, 272 100, 296 104 C 296 84, 320 72, 336 86 C 346 66, 380 70, 380 96 C 404 92, 418 120, 404 140 C 418 150, 414 170, 402 174 C 392 146, 370 132, 340 130 C 306 128, 276 140, 262 168 Z" fill="#6699CC"/>
    <path d="M330 86 c -6 -16 4 -28 16 -30" fill="none" stroke="#6699CC" stroke-width="8" stroke-linecap="round"/>
    <!-- raised eyebrows -->
    <path d="M290 172 q 14 -10 28 -2 M346 170 q 14 -8 28 2" fill="none" stroke="#4A6E99" stroke-width="6" stroke-linecap="round"/>
    <!-- eyes behind round glasses -->
    <ellipse cx="308" cy="204" rx="10" ry="12" fill="#2D2D2D"/>
    <ellipse cx="358" cy="204" rx="10" ry="12" fill="#2D2D2D"/>
    <circle cx="312" cy="199" r="4" fill="#fff"/>
    <circle cx="362" cy="199" r="4" fill="#fff"/>
    <g fill="#fff" fill-opacity="0.18" stroke="#2D2D2D" stroke-width="5">
      <circle cx="306" cy="204" r="22"/>
      <circle cx="360" cy="204" r="22"/>
    </g>
    <path d="M328 202 q 5 -6 10 0" fill="none" stroke="#2D2D2D" stroke-width="5"/>
    <path d="M284 200 l -20 -6 M382 200 l 22 -6" stroke="#2D2D2D" stroke-width="5" stroke-linecap="round"/>
    <!-- cheeks -->
    <ellipse cx="290" cy="238" rx="12" ry="7" fill="#F28E8E" opacity="0.55"/>
    <ellipse cx="378" cy="238" rx="12" ry="7" fill="#F28E8E" opacity="0.55"/>
    <!-- big happy grin with one tooth -->
    <path d="M308 236 C 316 262, 352 262, 360 236 Z" fill="#8A3B3B"/>
    <rect x="326" y="236" width="14" height="10" rx="2" fill="#fff"/>
    <path d="M326 254 q 8 -6 16 0" fill="#F28E8E"/>
  </g>

    </g>
  </g>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="none" stroke="#515151" stroke-width="6"/>
</svg>
