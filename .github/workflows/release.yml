name: Release

# Pushing a tag such as v0.3.0 builds Ettin Edit for Linux, Arch and Windows and
# publishes a GitHub release with the builds attached. "Run workflow" on the
# Actions tab does the same without pushing a tag: give it a tag name and it
# builds that tag, or creates the tag on the chosen commit (default: the head of
# the branch it runs on). Pull requests that touch the packaging only build, so
# packaging changes are checked before a release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, for example v0.3.0. Created if it doesn't exist.
        required: true
      commit:
        description: "Commit to tag when the tag does not exist yet (default: branch head)"
        required: false
  pull_request:
    paths:
      - .github/workflows/release.yml
      - packaging/**

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: sha
        name: Pick the commit to build
        shell: bash
        run: |
          tag="${{ inputs.tag }}"
          if [ -n "$tag" ] && sha=$(git rev-parse -q --verify "refs/tags/$tag^{commit}"); then
            echo "Building existing tag $tag"
          elif [ -n "${{ inputs.commit }}" ]; then
            sha=$(git rev-parse --verify "${{ inputs.commit }}^{commit}")
          else
            sha="${{ github.sha }}"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          git checkout -q "$sha"
      - id: v
        name: Read the version from Cargo.toml
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ] && [ "${{ github.ref_type }}" = tag ]; then tag="${{ github.ref_name }}"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -n "$tag" ] && [ "$tag" != "v$version" ]; then
            echo "::error::Tag $tag does not match the version in Cargo.toml ($version)"
            exit 1
          fi

  linux:
    name: Linux build
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          dir="ettin-edit-$VERSION-linux-x86_64"
          mkdir -p "$dir/icons"
          cp target/release/ettin-edit README.md "$dir/"
          cp packaging/linux/ettin-edit.desktop "$dir/"
          cp assets/icons/ettin-edit.svg assets/icons/ettin-edit-256.png "$dir/icons/"
          tar czf "$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: ettin-edit-*.tar.gz

  arch:
    name: Arch package
    needs: version
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed rust libxkbcommon libxkbcommon-x11 libglvnd \
            xdg-desktop-portal hicolor-icon-theme
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - name: Build with makepkg
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" packaging/arch/PKGBUILD
          grep -q "'!debug'" packaging/arch/PKGBUILD || sed -i "s/^options=(/options=('!debug' /" packaging/arch/PKGBUILD
          cd packaging/arch
          runuser -u builder -- makepkg --noconfirm --nodeps
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: packaging/arch/ettin-edit-*.pkg.tar.zst

  windows:
    name: Windows build
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          $dir = "ettin-edit-$env:VERSION-windows-x86_64"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/release/ettin-edit.exe, README.md $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ettin-edit-*.zip

  publish:
    name: Publish release
    needs: [version, linux, arch, windows]
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ needs.version.outputs.sha }}
          name: Ettin Edit ${{ needs.version.outputs.version }}
          generate_release_notes: true
          body: |
            ## Install

            **CachyOS / Arch:** download the `.pkg.tar.zst` file, then run
            `sudo pacman -U ./ettin-edit-${{ needs.version.outputs.version }}-1-x86_64.pkg.tar.zst`.
            It adds Ettin Edit to your app menu.

            **Other Linux:** download the `linux-x86_64.tar.gz`, extract it and run `./ettin-edit`.
            It needs OpenGL and `libxkbcommon-x11`.

            **Windows:** download the `windows-x86_64.zip`, extract it and run `ettin-edit.exe`.
            The build isn't signed yet, so Windows SmartScreen may warn the first time; choose "More info", then "Run anyway".

            See [FEATURES.md](https://github.com/Tharkis/NixPad/blob/${{ needs.version.outputs.tag }}/FEATURES.md) for what this version can do.
          files: dist/*
