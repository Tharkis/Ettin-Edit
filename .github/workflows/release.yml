name: Release

# Pushing a tag such as v0.3.0 builds Ettin Edit for Linux (.tar.gz, .deb, .rpm,
# AppImage, Flatpak), Arch and Windows, checks that every package carries its
# metadata (packaging/check-packages.sh) and publishes a GitHub release with
# the builds attached. "Run workflow" on the
# Actions tab does the same without pushing a tag: give it a tag name and it
# builds that tag, or creates the tag on the chosen commit (default: the head of
# the branch it runs on). Pull requests that touch the packaging only build, so
# packaging changes are checked before a release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, for example v0.3.0. Created if it doesn't exist.
        required: true
      commit:
        description: "Commit to tag when the tag does not exist yet (default: branch head)"
        required: false
  pull_request:
    paths:
      - .github/workflows/release.yml
      - packaging/**

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: sha
        name: Pick the commit to build
        shell: bash
        run: |
          tag="${{ inputs.tag }}"
          if [ -n "$tag" ] && sha=$(git rev-parse -q --verify "refs/tags/$tag^{commit}"); then
            echo "Building existing tag $tag"
          elif [ -n "${{ inputs.commit }}" ]; then
            sha=$(git rev-parse --verify "${{ inputs.commit }}^{commit}")
          else
            sha="${{ github.sha }}"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          git checkout -q "$sha"
      - id: v
        name: Read the version from Cargo.toml
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ] && [ "${{ github.ref_type }}" = tag ]; then tag="${{ github.ref_name }}"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -n "$tag" ] && [ "$tag" != "v$version" ]; then
            echo "::error::Tag $tag does not match the version in Cargo.toml ($version)"
            exit 1
          fi
          if ! grep -q "<release version=\"$version\"" packaging/linux/io.github.tharkis.EttinEdit.metainfo.xml; then
            echo "::error::Add a <release version=\"$version\"> entry to packaging/linux/io.github.tharkis.EttinEdit.metainfo.xml"
            exit 1
          fi

  linux:
    name: Linux build
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          dir="ettin-edit-$VERSION-linux-x86_64"
          mkdir -p "$dir/icons"
          cp target/release/ettin-edit README.md LICENSE "$dir/"
          cp packaging/linux/ettin-edit.desktop packaging/linux/io.github.tharkis.EttinEdit.metainfo.xml "$dir/"
          cp assets/icons/ettin-edit.svg assets/icons/ettin-edit-256.png "$dir/icons/"
          tar czf "$dir.tar.gz" "$dir"
      - name: Install the packaging tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q appstream appstream-compose librsvg2-common \
            desktop-file-utils rpm flatpak ostree zsync
          curl -fsSLo "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
      - name: Check the AppStream metadata
        run: appstreamcli validate --no-net packaging/linux/io.github.tharkis.EttinEdit.metainfo.xml
      - name: Debian, RPM, AppImage and Flatpak packages
        # The APT_SIGNING_KEY secret signs the Ettin Edit package repositories
        # (published with the manual on GitHub Pages). With it, the .deb, .rpm
        # and .flatpak add those repositories, so software updaters keep them
        # up to date. See packaging/debian, packaging/rpm and packaging/flatpak.
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool
        run: |
          if [ -z "$APT_SIGNING_KEY" ] && [ "${{ github.event_name }}" = pull_request ]; then
            # Without the secret, pull requests sign with a throwaway key to check the rest.
            export GNUPGHOME=$(mktemp -d)
            gpg --batch --passphrase '' --quick-gen-key "Ettin Edit test key" ed25519 sign never
            APT_SIGNING_KEY=$(gpg --armor --export-secret-keys)
            export APT_SIGNING_KEY
            unset GNUPGHOME
          fi
          packaging/debian/build-deb.sh "$VERSION" target/release/ettin-edit
          packaging/rpm/build-rpm.sh "$VERSION" target/release/ettin-edit
          packaging/appimage/build-appimage.sh "$VERSION" target/release/ettin-edit
          packaging/flatpak/build-flatpak.sh "$VERSION" target/release/ettin-edit
          ls -l ettin-edit*
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            ettin-edit-*.tar.gz
            ettin-edit_*.deb
            ettin-edit-*.rpm
            ettin-edit-*.AppImage
            ettin-edit-*.AppImage.zsync
            ettin-edit-*.flatpak

  arch:
    name: Arch package
    needs: version
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed rust libxkbcommon libxkbcommon-x11 libglvnd \
            xdg-desktop-portal hicolor-icon-theme
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - name: Build with makepkg
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" packaging/arch/PKGBUILD
          grep -q "'!debug'" packaging/arch/PKGBUILD || sed -i "s/^options=(/options=('!debug' /" packaging/arch/PKGBUILD
          cd packaging/arch
          runuser -u builder -- makepkg --noconfirm --nodeps
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: packaging/arch/ettin-edit-*.pkg.tar.zst

  windows:
    name: Windows build
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          $dir = "ettin-edit-$env:VERSION-windows-x86_64"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/release/ettin-edit.exe, README.md, LICENSE $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc "/DAppVersion=$env:VERSION" "/DSourceExe=$PWD\target\release\ettin-edit.exe" packaging\windows\ettin-edit.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item packaging\windows\ettin-edit-*-setup.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            ettin-edit-*.zip
            ettin-edit-*-setup.exe

  plugins:
    name: Sample plugin zips
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - name: Zip each sample plugin
        # One <id>.zip per folder in plugins/samples, with plugin.json at the
        # top, for the download links in plugins/index.json.
        run: |
          mkdir -p plugin-zips
          for dir in plugins/samples/*/; do
            id=$(basename "$dir")
            test -f "$dir/plugin.json" || continue
            (cd "$dir" && zip -r -X "$GITHUB_WORKSPACE/plugin-zips/$id.zip" . -x '__pycache__/*' '*/__pycache__/*' '*.pyc')
          done
          ls -l plugin-zips
      - uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: plugin-zips/*.zip

  check:
    name: Check the packages
    # Every package must carry its licence, website, release notes, desktop
    # file and icons, and the AppImage and Flatpak must start.
    needs: [version, linux, arch, windows]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Packages add the update repositories when they were signed: always on
      # pull requests (with a throwaway key), and with the APT_SIGNING_KEY secret.
      EXPECT_UPDATES: ${{ (github.event_name == 'pull_request' || secrets.APT_SIGNING_KEY != '') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Install the tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q appstream appstream-compose librsvg2-common desktop-file-utils \
            rpm rpm2cpio cpio zstd unzip createrepo-c apt-utils flatpak ostree \
            xvfb libxkbcommon-x11-0 libgl1 libegl1
      - name: Check the metadata
        run: packaging/check-packages.sh dist "$VERSION"
      - name: Build the package repositories from these packages
        # What the manual workflow does after a release, with a throwaway key.
        run: |
          export GNUPGHOME=$(mktemp -d)
          gpg --batch --passphrase '' --quick-gen-key "Ettin Edit test key" ed25519 sign never
          APT_SIGNING_KEY=$(gpg --armor --export-secret-keys)
          export APT_SIGNING_KEY
          unset GNUPGHOME
          mkdir -p repos/debs repos/rpms
          cp dist/*.deb repos/debs/ && cp dist/*.rpm repos/rpms/
          packaging/debian/build-apt-repo.sh repos/debs repos/apt
          packaging/rpm/build-rpm-repo.sh repos/rpms repos/rpm
          packaging/flatpak/build-flatpak-repo.sh dist/ettin-edit-*-x86_64.flatpak repos/flatpak
          zgrep -q 'ProjectLicense: MIT' repos/apt/dists/stable/main/dep11/Components-amd64.yml.gz
          zgrep -q '<project_license>MIT</project_license>' repos/rpm/repodata/*-appstream.xml.gz
          test "$(ostree --repo=repos/flatpak/repo refs | grep -c '^appstream2/x86_64$')" = 1
      - name: Start the AppImage
        run: |
          chmod +x dist/*.AppImage
          status=0
          HOME=$(mktemp -d) APPIMAGE_EXTRACT_AND_RUN=1 timeout 20 xvfb-run -a dist/ettin-edit-*-x86_64.AppImage || status=$?
          # 124: still running when the time was up, as it should be.
          if [ "$status" -ne 124 ]; then echo "::error::The AppImage stopped with $status"; exit 1; fi
      - name: Install and start the Flatpak
        run: |
          # Flatpak's sandbox needs user namespaces, which Ubuntu restricts.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//24.08
          flatpak install --user -y --noninteractive --bundle dist/ettin-edit-*-x86_64.flatpak
          flatpak info --user io.github.tharkis.EttinEdit
          status=0
          timeout 30 xvfb-run -a flatpak run io.github.tharkis.EttinEdit || status=$?
          if [ "$status" -ne 124 ]; then echo "::error::The Flatpak stopped with $status"; exit 1; fi

  rpm:
    name: Install the RPM on ${{ matrix.image }}
    needs: [version, linux]
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ['fedora:latest', 'opensuse/leap:15.6']
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist
      - name: Install
        run: |
          if command -v dnf >/dev/null; then
            dnf install -y dist/ettin-edit-*.x86_64.rpm
          else
            zypper --non-interactive --no-gpg-checks install dist/ettin-edit-*.x86_64.rpm
          fi
      - name: Check
        run: |
          rpm -qi ettin-edit
          test "$(rpm -q --qf '%{LICENSE}' ettin-edit)" = MIT
          test -f /usr/share/metainfo/io.github.tharkis.EttinEdit.metainfo.xml
          # Every library the program needs is there ("weak version not
          # found" only means an optional glibc function is missing).
          libs=$(LD_TRACE_LOADED_OBJECTS=1 /usr/bin/ettin-edit)
          echo "$libs"
          case "$libs" in *"=> not found"*) exit 1 ;; esac
          if [ -f /etc/pki/rpm-gpg/RPM-GPG-KEY-ettin-edit ]; then
            # With the key the package installs (dnf and zypper offer to
            # trust it on the first update), its signature checks out.
            rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-ettin-edit
            result=$(rpm -K dist/ettin-edit-*.x86_64.rpm 2>&1 || true)
            echo "$result"
            case "$result" in *"signatures OK"*) ;; *) exit 1 ;; esac
          fi

  publish:
    name: Publish release
    needs: [version, linux, arch, windows, plugins, check, rpm]
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ needs.version.outputs.sha }}
          name: Ettin Edit ${{ needs.version.outputs.version }}
          generate_release_notes: true
          body: |
            ## Install

            **CachyOS / Arch:** download the `.pkg.tar.zst` file, then run
            `sudo pacman -U ./ettin-edit-${{ needs.version.outputs.version }}-1-x86_64.pkg.tar.zst`.
            It adds Ettin Edit to your app menu.

            **Debian / Ubuntu:** download the `.deb` file, then run
            `sudo apt install ./ettin-edit_${{ needs.version.outputs.version }}_amd64.deb`.
            It adds the Ettin Edit package repository, so your software updater installs later versions.

            **Fedora / openSUSE:** download the `.rpm` file, then run
            `sudo dnf install ./ettin-edit-${{ needs.version.outputs.version }}-1.x86_64.rpm`
            (or `sudo zypper install` on openSUSE). It adds the Ettin Edit package repository, so your software updater installs later versions.

            **Flatpak (any Linux):** download the `.flatpak` file and open it with your software centre, or run
            `flatpak install --user ./ettin-edit-${{ needs.version.outputs.version }}-x86_64.flatpak`.
            It adds the Ettin Edit Flatpak repository, so `flatpak update` and your software centre install later versions.

            **AppImage (any Linux):** download the `.AppImage`, make it executable and run it.
            Ettin Edit and AppImage tools such as Gear Lever can update it.

            **Other Linux:** download the `linux-x86_64.tar.gz`, extract it and run `./ettin-edit`.
            The `.tar.gz` and AppImage need OpenGL and `libxkbcommon-x11`, which desktops have.

            **Windows:** download `windows-x86_64-setup.exe` and run it. It installs for your
            account without admin rights (or for everyone, if you choose), adds a Start menu
            entry, "Edit with Ettin Edit" in the right-click menu and "Open with" for text and
            code files. Prefer no installer? The `windows-x86_64.zip` has just `ettin-edit.exe`.
            The builds aren't signed yet, so Windows SmartScreen may warn the first time; choose "More info", then "Run anyway".

            See [FEATURES.md](https://github.com/Tharkis/Ettin-Edit/blob/${{ needs.version.outputs.tag }}/FEATURES.md) for what this version can do.
          files: dist/*
