[package]
name = "ettin-edit"
version = "1.5.0"
edition = "2024"
description = "A modern, cross-platform text editor for Linux and Windows"
license = "MIT"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"] }
egui = "0.36"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy", "parsing", "plist-load", "yaml-load"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
ropey = "1"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
unicode-segmentation = "1"
unicode-width = "0.2"
encoding_rs = "0.8.42"
chardetng = "1.0.0"
trash = "5.2.9"
roxmltree = "0.21.1"
miniz_oxide = "0.9.1"
similar = { version = "2.7.0", features = ["unicode"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
csv = "1.4.0"
egui_extras = "0.36"
skrifa = "0.44"
plist = "1.10"
ureq = { version = "3", features = ["platform-verifier"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = "0.11"
pulldown-cmark = { version = "0.13.4", default-features = false }
fluent-bundle = "0.16.0"
unic-langid = "0.9.6"
sys-locale = "0.3.2"
egui-phosphor = "0.14.0"
unicode_names2 = "4"

[profile.release]
opt-level = 3
lto = "thin"
strip = true


[dev-dependencies]
fluent-syntax = "0.12"

[build-dependencies]
winresource = "0.1"

# The regex engines are very slow unoptimised; this keeps debug builds usable
# (syntax highlighting and the function list both lean on them).
[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.regex-syntax]
opt-level = 3
